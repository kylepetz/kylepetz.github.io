<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is Ryan Day Fired?</title>
  <meta name="description" content="Is Ryan Day, head coach of Ohio State football, fired? One word answer.">
  <meta property="og:title" content="Is Ryan Day Fired?">
  <meta property="og:description" content="One question. One answer.">
  <meta property="og:url" content="https://isryandayfired.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <style>
    :root {
      --scarlet: #ba0c2f;
      --gray: #a7b1b7;
      --ink: #ffffff;
      --bg: #1a1a1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    body.fired { background: var(--scarlet); }
    h1 {
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 500;
      color: var(--gray);
      letter-spacing: .02em;
    }
    .answer {
      font-size: clamp(6rem, 30vw, 18rem);
      font-weight: 900;
      line-height: 1;
      margin: .1em 0;
      color: var(--scarlet);
    }
    body.fired .answer { color: var(--ink); }
    body.fired h1, body.fired .detail, body.fired footer { color: #f3d6dc; }
    .detail {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--gray);
      max-width: 32rem;
    }
    footer {
      position: fixed;
      bottom: 16px;
      font-size: .8rem;
      color: #6b7378;
    }
  </style>
</head>
<body>
  <h1>Is Ryan Day fired?</h1>
  <p class="answer" id="answer">NO.</p>
  <p class="detail" id="detail">He is still the head coach of Ohio State football.</p>
  <footer>Last checked <time id="checked"></time></footer>

  <script>
    // ── Update these two lines when the news changes ──
    const FIRED = false;
    const LAST_CHECKED = "2026-11-08";

    if (FIRED) {
      document.body.classList.add("fired");
      document.getElementById("answer").textContent = "YES.";
      document.getElementById("detail").textContent = "Ryan Day is no longer the head coach of Ohio State football.";
    }
    const d = new Date(LAST_CHECKED + "T12:00:00");
    const t = document.getElementById("checked");
    t.dateTime = LAST_CHECKED;
    t.textContent = d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  </script>
</body>
</html>
